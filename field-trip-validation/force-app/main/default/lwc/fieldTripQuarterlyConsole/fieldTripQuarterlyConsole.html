<template>
    <main class="console-shell">
        <header class="console-header">
            <div class="identity">
                <lightning-icon icon-name="standard:work_order" alternative-text="Field Trip quarterly" size="medium"></lightning-icon>
                <div>
                    <h1>Field Trip Quarterly</h1>
                    <p>Salesforce-managed Analyze, authoritative report generation, and OneDrive publication.</p>
                </div>
            </div>
            <div class="header-actions">
                <span class={environmentClass}>{environmentLabel}</span>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh run status"
                    title="Refresh run status"
                    onclick={handleRefresh}
                    disabled={isLoading}>
                </lightning-button-icon>
            </div>
        </header>

        <section class="status-band" aria-label="Execution status">
            <div><span>Target</span><strong>{state.targetOrg}</strong></div>
            <div><span>Active Batch Apex</span><strong>{state.activeBatchJobs} / 3</strong></div>
            <div><span>Available analyses</span><strong>{analysisCount}</strong></div>
            <div><span>Recent runs</span><strong>{runCount}</strong></div>
            <div><span>Completed analyses</span><strong>{analyzedAnalysisCount}</strong></div>
            <div><span>Latest Analyze (UTC)</span><strong>{latestAnalyzeLabel}</strong></div>
        </section>

        <template lwc:if={errorMessage}>
            <div class="message message_error" role="alert">{errorMessage}</div>
        </template>
        <template lwc:if={successMessage}>
            <div class="message message_success" role="status">{successMessage}</div>
        </template>

        <section class="request-panel" aria-labelledby="request-heading">
            <div class="section-heading">
                <div><span>New request</span><h2 id="request-heading">Quarterly operation</h2></div>
                <template lwc:if={isLoading}><lightning-spinner alternative-text="Loading Field Trip runs" size="small"></lightning-spinner></template>
            </div>

            <lightning-radio-group
                name="operation"
                label="Operation"
                options={operationOptions}
                value={operation}
                type="button"
                onchange={handleOperationChange}>
            </lightning-radio-group>

            <div class="date-grid">
                <lightning-input type="date" label="Start date" value={startDate} onchange={handleStartDateChange} required></lightning-input>
                <lightning-input type="date" label="End date (exclusive)" value={endDateExclusive} onchange={handleEndDateChange} required></lightning-input>
            </div>

            <template lwc:if={isAnalyzeOperation}>
                <lightning-dual-listbox
                    name="analyses"
                    label="Object Analyses"
                    source-label="Available"
                    selected-label="Selected"
                    options={analysisOptions}
                    value={selectedAnalysisIds}
                    onchange={handleAnalysisSelection}
                    min="1"
                    disable-reordering>
                </lightning-dual-listbox>
            </template>
            <template lwc:else>
                <lightning-dual-listbox
                    name="reportGroups"
                    label="Report groups"
                    source-label="Available"
                    selected-label="Selected"
                    options={reportGroupOptions}
                    value={selectedReportGroups}
                    onchange={handleReportGroupSelection}
                    min="1"
                    disable-reordering>
                </lightning-dual-listbox>
            </template>

            <template lwc:if={requiresProductionConfirmation}>
                <div class="production-confirmation">
                    <lightning-input
                        type="checkbox"
                        label="I confirm this operation will run against Production"
                        checked={confirmedProduction}
                        onchange={handleProductionConfirmation}>
                    </lightning-input>
                </div>
            </template>

            <div class="request-actions">
                <lightning-button
                    variant="brand"
                    icon-name={submitIcon}
                    label={submitLabel}
                    onclick={handleSubmit}
                    disabled={isSubmitDisabled}>
                </lightning-button>
            </div>
        </section>

        <section class="runs-panel" aria-labelledby="runs-heading">
            <div class="section-heading">
                <div><span>Audit history</span><h2 id="runs-heading">Recent runs</h2></div>
            </div>
            <template lwc:if={hasRuns}>
                <div class="run-list">
                    <template for:each={runs} for:item="run">
                        <article class="run" key={run.id}>
                            <div class="run-summary">
                                <div class="run-title">
                                    <lightning-icon icon-name={run.iconName} alternative-text="" size="small"></lightning-icon>
                                    <div><span>{run.name}</span><h3>{run.operation}</h3></div>
                                </div>
                                <div class="run-actions">
                                    <span class={run.statusClass}>{run.status}</span>
                                    <template lwc:if={run.canRecover}>
                                        <lightning-button
                                            label="Mark failed"
                                            variant="destructive-text"
                                            icon-name="utility:error"
                                            data-id={run.id}
                                            onclick={handleOpenRecoveryDialog}>
                                        </lightning-button>
                                    </template>
                                    <template lwc:if={run.canDeleteRun}>
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            alternative-text="Remove run"
                                            title="Remove run"
                                            data-id={run.id}
                                            disabled={isSubmitting}
                                            onclick={handleRemoveRun}>
                                        </lightning-button-icon>
                                    </template>
                                </div>
                            </div>
                            <dl class="run-metadata">
                                <div><dt>Window</dt><dd>{run.windowLabel}</dd></div>
                                <div><dt>Requested by</dt><dd>{run.requestedBy}</dd></div>
                                <div><dt>Requested</dt><dd><lightning-formatted-date-time value={run.requestedAt} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></dd></div>
                                <div><dt>Target</dt><dd>{run.targetOrg}</dd></div>
                            </dl>
                            <template lwc:if={run.failureSummary}><div class="run-error" role="alert">{run.failureSummary}</div></template>
                            <template lwc:if={run.hasItems}>
                                <div class="artifact-list">
                                    <template for:each={run.items} for:item="item">
                                        <div class="artifact" key={item.id}>
                                            <div class="artifact-identity">
                                                <lightning-icon icon-name={item.iconName} alternative-text="" size="x-small"></lightning-icon>
                                                <div><strong>{item.displayName}</strong><span>{item.detailLabel}</span></div>
                                            </div>
                                            <div class="artifact-actions">
                                                <span class={item.statusClass}>{item.status}</span>
                                                <template lwc:if={item.canDownload}>
                                                    <lightning-button-icon
                                                        icon-name="utility:download"
                                                        alternative-text={item.downloadLabel}
                                                        title={item.downloadLabel}
                                                        data-url={item.downloadUrl}
                                                        onclick={handleDownload}>
                                                    </lightning-button-icon>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template lwc:if={run.canOpenFolder}>
                                <div class="folder-action">
                                    <lightning-button
                                        variant="base"
                                        icon-name="utility:open_folder"
                                        label="Open OneDrive folder"
                                        data-url={run.outputFolderUrl}
                                        onclick={handleDownload}>
                                    </lightning-button>
                                </div>
                            </template>
                        </article>
                    </template>
                </div>
            </template>
            <template lwc:else><div class="empty-state">No governed Field Trip runs have been submitted.</div></template>
        </section>

        <template lwc:if={isRecoveryDialogOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="recovery-dialog-heading" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon class="slds-modal__close" icon-name="utility:close" alternative-text="Close recovery dialog" title="Close" onclick={handleCloseRecoveryDialog}></lightning-button-icon>
                        <h2 id="recovery-dialog-heading" class="slds-modal__title">{recoveryDialogTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-textarea
                            label="Recovery reason"
                            value={recoveryReason}
                            minlength="20"
                            maxlength="32000"
                            required
                            onchange={handleRecoveryReasonChange}>
                        </lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseRecoveryDialog}></lightning-button>
                        <lightning-button class="slds-m-left_small" variant="destructive" label="Mark run failed" disabled={isRecoverySubmitDisabled} onclick={handleRecoverRun}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </main>
</template>
