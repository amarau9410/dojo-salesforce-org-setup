<template>
    <lightning-card title="My Shift Inbox" icon-name="standard:task2">
        <div class="header-actions slds-p-horizontal_small slds-p-top_x-small">
            <lightning-button label="Refresh" onclick={handleRefresh}></lightning-button>
        </div>

        <template if:true={hasRows}>
            <div class="slds-p-around_small">
                <lightning-datatable
                    key-field="taskId"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}
                    max-row-selection="1">
                </lightning-datatable>
            </div>
        </template>

        <template if:false={hasRows}>
            <div class="slds-p-around_medium slds-text-align_center">
                <p class="slds-text-heading_small">No assigned shifts</p>
                <p class="slds-text-body_small">New shift assignments will appear here.</p>
            </div>
        </template>
    </lightning-card>
</template>
