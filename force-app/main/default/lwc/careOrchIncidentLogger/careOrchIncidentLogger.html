<template>
    <section class="incident-launcher">
        <lightning-button
            variant="brand"
            label="Log Critical Incident"
            title="Log Critical Incident"
            onclick={handleLaunchLogger}
            disabled={isBusy}>
        </lightning-button>
    </section>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">Log Critical Incident</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isStepOne}>
                        <p class="slds-text-title_caps">Click 1 completed: context captured</p>
                        <p class="slds-m-top_small">{contextMessage}</p>
                        <template if:true={contextError}>
                            <p class="slds-text-color_error slds-m-top_small">{contextError}</p>
                        </template>
                        <lightning-combobox
                            class="slds-m-top_medium"
                            name="taxonomy"
                            label="Click 2: Select Incident Taxonomy"
                            value={selectedTaxonomy}
                            options={taxonomyOptions}
                            onchange={handleTaxonomyChange}
                            required>
                        </lightning-combobox>
                    </template>

                    <template if:true={isStepTwo}>
                        <p class="slds-text-title_caps">Click 2 completed: taxonomy selected</p>
                        <p class="slds-m-top_small">Taxonomy: {selectedTaxonomy}</p>
                        <p class="slds-m-top_small">Click 3 submits and dispatches notifications immediately.</p>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal} class="slds-m-right_small"></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Submit Incident"
                        onclick={handleSubmitIncident}
                        disabled={submitDisabled}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
