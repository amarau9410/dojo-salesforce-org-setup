name: Field Trip Quality Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/field-trip-quality-checks.yml"
      - "field-trip-validation/**"

permissions:
  contents: read

jobs:
  lwc-jest:
    name: LWC Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-trip-validation
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run LWC Jest tests
        run: npm run test:unit -- -- --runInBand

  code-analyzer:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-trip-validation
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install @salesforce/plugin-code-analyzer

      - name: Run recommended analysis
        run: |
          set -o pipefail
          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          sf code-analyzer run \
            --rule-selector Recommended \
            --target "force-app/main/default/classes,force-app/main/default/lwc" \
            --output-file "./code-analyzer-results-${timestamp}.json" \
            --include-fixes 2>&1 | tee "./code-analyzer-results-${timestamp}.log"

      - name: Upload analyzer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-trip-code-analyzer-results
          path: |
            field-trip-validation/code-analyzer-results-*.json
            field-trip-validation/code-analyzer-results-*.log
          if-no-files-found: warn
